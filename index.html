<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitShop - E-commerce</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🛍️ GitShop</div>

    <nav>
        <a href="#">Accueil</a>
        <a href="#products">Produits</a>
    </nav>

    <div id="cart-area"></div>
</header>

<section class="hero">
    <div class="hero-content">
        <span class="badge">GIT FLOW DEMO</span>

        <h1>Découvrez nos meilleurs produits</h1>

        <p>
            Technologie, qualité et innovation.
            Trouvez votre prochain produit préféré.
        </p>

        <a href="#products" class="hero-btn">
            Explorer les produits →
        </a>
    </div>
</section>

<main id="products">

    <div class="section-header">
        <div>
            <h2>Nos Produits</h2>
            <p>Découvrez notre sélection</p>
        </div>

        <div id="search-area"></div>
    </div>

    <div id="product-list" class="products"></div>

</main>

<section id="cart-section"></section>

<footer>
    <p>GitShop © 2026 — Git Flow Live Demo</p>
</footer>

<script src="app.js"></script>



</body>
</html>
